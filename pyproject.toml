[project]
name = "voice-orchestrator"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "livekit-agents[openai,silero,turn-detector]==1.8.5",
  "faster-whisper==1.2.1",
  "kokoro-onnx>=0.6,<0.7",
  "pyrnnoise>=0.4,<0.5",
  "pydantic-settings>=2.6",
  "numpy>=1.26",
]

[project.optional-dependencies]
indic = ["torch>=2.3", "torchaudio>=2.3", "transformers>=4.44", "onnxruntime>=1.18"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7", "soundfile>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vo"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
