# LiveKit server + SIP bridge + Redis for phone calls (host networking: Linux only).
# Mirrors github.com/livekit/sip docker-compose.yaml. SIP 5060/udp+tcp and RTP 10000-20000/udp
# must be reachable from your SIP provider.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0 --redis-host localhost:6379
    network_mode: host
    depends_on: [redis]
  sip:
    image: livekit/sip:latest
    network_mode: host
    depends_on: [redis, livekit]
    environment:
      SIP_CONFIG_BODY: |
        api_key: devkey
        api_secret: secret
        ws_url: ws://localhost:7880
        redis:
          address: localhost:6379
        sip_port: 5060
        rtp_port: 10000-20000
        use_external_ip: true
        logging:
          level: info
